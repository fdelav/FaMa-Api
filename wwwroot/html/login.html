<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaMa · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css?v=5" rel="stylesheet">
<link href="/css/login.css?v=5" rel="stylesheet">
</head>
<body>

<header class="top d-flex justify-content-between align-items-center">
  <div class="brand">
    <h1>FaMa<small>Panel de monitoreo de equipos</small></h1>
  </div>
</header>

<main class="login-wrap">
  <section class="panel login-card" aria-labelledby="login-titulo">
    <div class="panel-title d-flex justify-content-between" id="login-titulo">
      <span>Iniciar sesión</span>
    </div>

    <form id="login-form" class="login-body" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input type="email" class="form-control" id="email" name="username" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="login-error" role="alert"></div>
      <button type="submit" class="btn btn-primary">Iniciar sesión</button>
    </form>
  </section>
</main>

<script src="/js/login.js?v=4"></script>
</body>
</html>
