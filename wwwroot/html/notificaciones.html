<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaMa · Notificaciones</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
<link href="/css/notificaciones.css" rel="stylesheet">
</head>
<body>

<header class="top d-flex justify-content-between align-items-center flex-wrap gap-2">
  <h1>FaMa · Notificaciones</h1>
  <div class="d-flex gap-2 align-items-center">
    <span class="updated mono" id="nt-actualizado"></span>
    <a class="close-session-btn nt-link" href="/index.html">← Volver al panel</a>
    <button class="close-session-btn" id="nt-cerrar-sesion">Cerrar sesión</button>
  </div>
</header>

<main class="container-fluid p-3">
  <div class="panel">
    <!-- Filtros -->
    <form class="nt-filtros" id="nt-filtros" autocomplete="off">
      <div class="nt-campo">
        <label for="f-estado">Estado</label>
        <select id="f-estado" class="form-select form-select-sm">
          <option value="todas">Todas</option>
          <option value="no-leidas">No leídas</option>
          <option value="leidas">Leídas</option>
        </select>
      </div>
      <div class="nt-campo">
        <label for="f-desde">Desde</label>
        <input type="date" id="f-desde" class="form-control form-control-sm">
      </div>
      <div class="nt-campo">
        <label for="f-hasta">Hasta</label>
        <input type="date" id="f-hasta" class="form-control form-control-sm">
      </div>
      <div class="nt-campo nt-campo-btn">
        <button type="button" class="close-session-btn" id="f-limpiar">Limpiar filtros</button>
      </div>
      <div class="nt-acciones">
        <span class="mono nt-contador" id="nt-contador"></span>
        <button type="button" class="btn btn-sm btn-primary" id="nt-marcar" disabled>Marcar seleccionadas como leídas</button>
      </div>
    </form>

    <!-- Lista -->
    <div class="nt-cabecera">
      <input type="checkbox" id="nt-todas-pagina" title="Seleccionar las no leídas de esta página">
      <span></span>
      <span>Mensaje</span>
      <span class="nt-col-pc">Equipo</span>
      <span class="nt-col-fecha">Fecha</span>
      <span class="nt-col-estado">Estado</span>
    </div>
    <div id="nt-lista"><div class="nt-vacio">Cargando notificaciones…</div></div>

    <!-- Paginación -->
    <div class="nt-paginacion">
      <button type="button" class="close-session-btn" id="nt-prev">← Anterior</button>
      <span class="mono" id="nt-pagina"></span>
      <button type="button" class="close-session-btn" id="nt-next">Siguiente →</button>
    </div>
  </div>
</main>

<script src="/js/notificaciones.js"></script>
</body>
</html>
