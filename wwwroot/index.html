<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaMa · Panel de monitoreo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=4" rel="stylesheet">
<link href="css/kpi-filtro.css?v=4" rel="stylesheet">
</head>
<body>

<header class="top d-flex justify-content-between align-items-center">
  <div class="brand">
    <h1>FaMa<small>Panel de monitoreo de equipos</small></h1>
  </div>

  <nav class="nav-pildoras" aria-label="Secciones">
    <ul class="nav nav-pills">
      <li class="nav-item"><a class="nav-link active" href="/index.html" aria-current="page">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="/html/notificaciones.html">Notificaciones</a></li>
    </ul>
  </nav>

  <div class="d-flex gap-2 align-items-center">
    <span class="updated mono" id="ultima-actualizacion"></span>
    <button class="close-session-btn" id="btn-descargar" type="button">Descargar datos</button>
    <button class="close-session-btn" id="btn-cerrar-sesion" type="button" onclick="closeSession()">Cerrar sesión</button>
  </div>
</header>

<main class="container-fluid p-3 p-lg-4">
  <!-- Información clave -->
  <div class="row g-3 mb-3" id="fila-kpis"></div>

  <div class="row g-3">
    <!-- Equipos -->
    <div class="col-xl-9 order-xl-1 order-2">
      <div class="panel">
        <div class="panel-title d-flex justify-content-between flex-wrap gap-2">
          <span>Equipos<span class="count mono" id="conteo-equipos"></span></span>
          <span id="filtro-activo"></span>
        </div>
        <div class="equipos-grid" id="grid-equipos"><div class="vacio">Cargando equipos…</div></div>
      </div>
    </div>

    <!-- Notificaciones -->
    <div class="col-xl-3 order-xl-2 order-1">
      <div class="panel">
        <div class="panel-title d-flex justify-content-between">
          <span>Alertas sin leer<span class="count mono" id="conteo-notif"></span></span>
          <button class="btn btn-sm btn-primary" id="btn-marcar-leidas" type="button" onclick="markAsRead()">Marcar leídas</button>
        </div>
        <div class="notif-list" id="lista-notificaciones"></div>
        <a class="notif-mas" id="notif-mas" href="/html/notificaciones.html" hidden>Ver historial completo</a>
      </div>
    </div>
  </div>
</main>

<script src="js/kpi-filtro.js?v=4"></script>
<script src="js/dashboard.js?v=4"></script>
<script src="js/descarga.js?v=4"></script>
<script src="js/detalle-equipo.js?v=4"></script>
</body>
</html>
