<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaMa · Panel de monitoreo</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<header class="top d-flex justify-content-between align-items-center">
  <h1>FaMa · Panel de monitoreo</h1>
  <div class="nav-pildoras d-flex gap-2 align-items-center">
    <ul class="nav nav-pills mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Home</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-notifications-tab" data-bs-toggle="pill" data-bs-target="#pills-notifications" type="button" role="tab" aria-controls="pills-notifications" aria-selected="false">Notificaciones</button>
      </li>
    </ul>
  </div>
  <div class="d-flex gap-2 align-items-center" id="" role>
    <span class="updated mono" id="ultima-actualizacion"></span>
    <button class="close-session-btn" id="btn-cerrar-sesion" onclick="closeSession()">Cerrar Sesión</button>
  </div>
  
</header>


<main class="container-fluid p-3">

  <!-- Información clave -->
  <div class="row g-3 mb-3" id="fila-kpis"></div>

  <div class="row g-3">
    <!-- Notificaciones -->
    <div class="col-lg-3">
      <div class="panel h-100">
        <div class="panel-title d-flex justify-content-between">
          <span>Notificaciones</span>
          <button class="btn btn-sm btn-primary" id="btn-marcar-leidas" onclick="markAsRead()">Marcar como leídas</button>
        </div>
        <div class="notif-list" id="lista-notificaciones"></div>
      </div>
    </div>

    <!-- Equipos -->
    <div class="col-lg-9">
      <div class="panel">
        <div class="panel-title d-flex justify-content-between">
          <span>Equipos</span>
          <span class="mono" style="font-weight:400; color:var(--muted);">colores = diseño de referencia, umbrales sin definir</span>
        </div>
        <div class="equipos-grid" id="grid-equipos"></div>
      </div>
    </div>
  </div>

</main>

<script src="js/dashboard.js"></script>
</body>
</html>
